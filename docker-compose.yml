version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: eventflow-api:local
    container_name: eventflow-api
    ports:
      - "4053:4053"
    env_file:
      - .env

    # Outbox concurrency knobs. Values set here override .env, so a
    # benchmark run can change them from the shell without editing a file:
    #   OUTBOX_WORKERS=4 docker compose up -d --force-recreate api
    environment:
      OUTBOX_WORKERS: ${OUTBOX_WORKERS:-1}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-10}
      OUTBOX_INTERVAL: ${OUTBOX_INTERVAL:-5s}

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - eventflow-net

  postgres:
    image: postgres:17
    container_name: eventflow-postgres

    environment:
      POSTGRES_DB: eventflow
      POSTGRES_USER: eventflow
      POSTGRES_PASSWORD: eventflow

    ports:
      - "5452:5432"

    networks:
      - eventflow-net

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: eventflow-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    depends_on:
      - postgres

    networks:
      - eventflow-net

    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json

  prometheus:
    image: prom/prometheus:latest
    container_name: eventflow-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    depends_on:
      - api

    networks:
      - eventflow-net

    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  prometheus_data:

networks:
  eventflow-net:
    driver: bridge